    <style>
        :root {
            /* Tema Escuro Padrão */
            --bg-color: #0f0f0f;
            --text-color: #d1d1d1;
            --sidebar-bg: #111;
            --chat-bg-user: #2a2a2a;
            --chat-bg-ai: #181818;
            --primary-bg: #fff;
            --primary-text: #000;
            --border-color: #222;
            --input-bg: #181818;
            --message-font-size: 15px;
            --code-bg: #000;
            --modal-bg: #141414;
        }

        /* Modo Claro */
        body.light-mode {
            --bg-color: #f0f2f5;
            --text-color: #1c1e21;
            --sidebar-bg: #ffffff;
            --chat-bg-user: #dcf8c6; /* Estilo WhatsApp */
            --chat-bg-ai: #ffffff;
            --primary-bg: #000;
            --primary-text: #fff;
            --border-color: #ddd;
            --input-bg: #ffffff;
            --code-bg: #2d2d2d;
            --modal-bg: #ffffff;
        }

        /* Temas de Cor (Aplicado na Cor Principal) */
        body.theme-blue { --primary-bg: #4285F4; --primary-text: #ffffff; }
        body.theme-purple { --primary-bg: #9b59b6; --primary-text: #ffffff; }
        body.theme-green { --primary-bg: #00ff00; --primary-text: #000000; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* Bloqueio de Imagens */
        #chat-container img:not(.logo-img) { display: none !important; }

        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); z-index: 1000; transition: left 0.3s ease, background-color 0.3s; display: flex; flex-direction: column; padding: 20px; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-sidebar { background: none; border: none; color: var(--text-color); font-size: 1.5rem; cursor: pointer; }
        .new-chat-btn { background-color: var(--primary-bg); color: var(--primary-text); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .new-chat-btn:hover { opacity: 0.8; }

        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .chat-item { background: var(--chat-bg-ai); padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; color: var(--text-color); transition: 0.2s; }
        .chat-item.active { background: var(--chat-bg-user); border-color: var(--primary-bg); }
        .chat-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 10px; }
        .action-btns { display: flex; gap: 5px; }
        .rename-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .rename-btn:hover { color: var(--primary-bg); }
        .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .delete-btn:hover { color: #ff1a1a; }

        .settings-btn { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; transition: 0.2s; }
        .settings-btn:hover { background-color: var(--chat-bg-ai); border-color: var(--primary-bg); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; }
        .overlay.show { display: block; }

        /* Header e Controles */
        header { padding: 10px 15px; width: 100%; border-bottom: 1px solid var(--border-color); background-color: var(--sidebar-bg); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; z-index: 100; transition: background-color 0.3s; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 35px; width: auto; border-radius: 5px; }
        
        .controls { display: flex; gap: 12px; align-items: center; }
        .chat-badge { font-size: 0.75rem; background: var(--chat-bg-ai); color: var(--text-color); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-color); font-weight: bold; }

        /* Chat */
        #chat-container { flex: 1; width: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; margin: 0 auto; max-width: 800px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: var(--message-font-size); animation: fadeIn 0.2s ease; position: relative; color: var(--text-color); transition: background-color 0.3s, font-size 0.3s; }
        .user-message { align-self: flex-end; background-color: var(--chat-bg-user); border-right: 4px solid var(--primary-bg); }
        .ai-message { align-self: flex-start; background-color: var(--chat-bg-ai); border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Botão Copiar */
        .code-container { position: relative; margin: 10px 0; }
        pre { background: var(--code-bg); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); color: #f1f1f1; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #555; }

        .input-area { width: 100%; padding: 15px 20px; display: flex; gap: 10px; background: var(--bg-color); border-top: 1px solid var(--border-color); max-width: 800px; margin: 0 auto; transition: background-color 0.3s; }
        input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; color: var(--text-color); outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary-bg); }
        .send-btn { background: var(--primary-bg); color: var(--primary-text); border: none; padding: 0 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { opacity: 0.8; }
        
        .login-btn { background: #4285F4; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .login-btn:hover { background: #3367D6; }

        /* Custom Modal Layout */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--modal-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 16px; width: 90%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .modal-title { font-size: 1.25rem; font-weight: bold; color: var(--text-color); text-align: center; }
        .modal-section-title { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        
        /* Select Menuzinho */
        .custom-select-modal { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; color: var(--text-color); font-weight: bold; font-size: 0.95rem; outline: none; cursor: pointer; transition: 0.2s; appearance: none; text-align: center; }
        .custom-select-modal:focus { border-color: var(--primary-bg); }
        .custom-select-modal option { background: var(--input-bg); color: var(--text-color); }

        .custom-opt { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; color: var(--text-color); text-align: center; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .custom-opt:hover { border-color: #888; }
        .custom-opt.selected { background: var(--primary-bg); color: var(--primary-text); border-color: var(--primary-bg); }
        .persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .start-chat-btn { background: var(--primary-bg); color: var(--primary-text); border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; text-align: center; margin-top: 10px; transition: 0.2s; }
        .start-chat-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>
    <div id="sidebar" class="sidebar">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCyv_-Cf12mMlKBzegxG2YnkpimEN-AATE", authDomain: "migs-ai.firebaseapp.com", projectId: "migs-ai", storageBucket: "migs-ai.firebasestorage.app", messagingSenderId: "497142458753", appId: "1:497142458753:web:e99b79b5128ec6e8d02080" };

        const auth = getAuth(app);

        // NOVA CHAVE APLICADA
        const API_KEY_GROQ = "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";

        let currentUser = null;
        let sessions = []; 
        let currentSessionId = null; 
        let chatHistory = []; 

        let tempLang = "pt";
        let tempPersona = "nerd";

        // ================= SISTEMA DE CONFIGURAÇÕES =================
        function carregarConfiguracoes() {
            const config = JSON.parse(localStorage.getItem("migsAiConfig")) || {
                mode: "dark",
                theme: "default",
                fontSize: "15px"
            };

            // Aplicar Valores aos Selects
            document.getElementById("themeModeSelect").value = config.mode;
            document.getElementById("colorThemeSelect").value = config.theme;
            document.getElementById("fontSizeSelect").value = config.fontSize;

            aplicarConfiguracoesVisuais(config);
        }

        function aplicarConfiguracoesVisuais(config) {
            // Modo Claro/Escuro
            if (config.mode === "light") document.body.classList.add("light-mode");
            else document.body.classList.remove("light-mode");

            // Tema de Cores
            document.body.classList.remove("theme-blue", "theme-purple", "theme-green");
            if (config.theme !== "default") document.body.classList.add(`theme-${config.theme}`);

            // Tamanho da Fonte
            document.documentElement.style.setProperty('--message-font-size', config.fontSize);
        }

        document.getElementById("openSettingsBtn").onclick = () => {
            sidebar.classList.remove("open");
            document.getElementById("settingsModal").classList.add("show");
        };

        document.getElementById("saveSettingsBtn").onclick = () => {
            const config = {
                mode: document.getElementById("themeModeSelect").value,
                theme: document.getElementById("colorThemeSelect").value,
                fontSize: document.getElementById("fontSizeSelect").value
            };
            localStorage.setItem("migsAiConfig", JSON.stringify(config));
            aplicarConfiguracoesVisuais(config);
            document.getElementById("settingsModal").classList.remove("show");
            overlay.classList.remove("show");
        };

        carregarConfiguracoes(); // Inicia com as configs salvas
        // ==========================================================

        const uiTranslations = {
            pt: {
                sidebarTitle: "Meus Chats", newChat: "+ Novo Papo", placeholder: "Manda a braba...", sendBtn: "Enviar", loginBtn: "Login", renamePrompt: "Novo nome do chat:",
                optNerd: "Nerd 🤓", optSarcastic: "Sarcástico 💀", optFriendly: "Amigável ✨", optIrritated: "Irritado 😑", optHack: "Hack 💻",
                defaultTitle: "Novo Papo", modalTitle: "Configurar Novo Papo", modalLang: "Escolha o Idioma", modalPersona: "Escolha a Personalidade", modalStart: "Iniciar Conversa"
            },
            en: {
                sidebarTitle: "My Chats", newChat: "+ New Chat", placeholder: "Type something...", sendBtn: "Send", loginBtn: "Login", renamePrompt: "New chat name:",
                optNerd: "Nerd 🤓", optSarcastic: "Sarcastic 💀", optFriendly: "Friendly ✨", optIrritated: "Irritated 😑", optHack: "Hack 💻",
                defaultTitle: "New Chat", modalTitle: "Setup New Chat", modalLang: "Choose Language", modalPersona: "Choose Persona", modalStart: "Start Chat"
            },
            es: {
                sidebarTitle: "Mis Chats", newChat: "+ Nuevo Chat", placeholder: "Escribe algo...", sendBtn: "Enviar", loginBtn: "Acceder", renamePrompt: "Nuevo nombre del chat:",
                optNerd: "Nerd 🤓", optSarcastic: "Sarcástico 💀", optFriendly: "Amigable ✨", optIrritated: "Irritado 😑", optHack: "Hack 💻",
                defaultTitle: "Nuevo Chat", modalTitle: "Configurar Nuevo Chat", modalLang: "Elige el Idioma", modalPersona: "Elige la Personalidad", modalStart: "Iniciar Conversación"
            },
            fr: {
                sidebarTitle: "Mes Chats", newChat: "+ Nouveau Chat", placeholder: "Écrivez quelque chose...", sendBtn: "Envoyer", loginBtn: "Connexion", renamePrompt: "Nouveau nom du chat:",
                optNerd: "Nerd 🤓", optSarcastic: "Sarcastique 💀", optFriendly: "Amical ✨", optIrritated: "Irrité 😑", optHack: "Hack 💻",
                defaultTitle: "Nouveau Chat", modalTitle: "Configurer le Chat", modalLang: "Choisir la Langue", modalPersona: "Choisir la Personnalité", modalStart: "Démarrer"
            },
            it: {
                sidebarTitle: "I Miei Chat", newChat: "+ Nuova Chat", placeholder: "Scrivi qualcosa...", sendBtn: "Invia", loginBtn: "Accedi", renamePrompt: "Nuovo nome della chat:",
                optNerd: "Nerd 🤓", optSarcastic: "Sarcastico 💀", optFriendly: "Amichevole ✨", optIrritated: "Irritato 😑", optHack: "Hack 💻",
                defaultTitle: "Nuova Chat", modalTitle: "Configura Nuova Chat", modalLang: "Scegli la Lingua", modalPersona: "Scegli la Personalità", modalStart: "Inizia Chat"
            },
            de: {

                defaultTitle: "Neuer Chat", modalTitle: "Neuen Chat einrichten", modalLang: "Sprache wählen", modalPersona: "Persönlichkeit wählen", modalStart: "Chat starten"
            }
        };

        function translateUI(lang) {
            const t = uiTranslations[lang] || uiTranslations["en"];
            
            document.getElementById("sidebar-title").innerText = t.sidebarTitle;
            document.getElementById("newChatBtn").innerText = t.newChat;
            document.getElementById("userInput").placeholder = t.placeholder;
            document.getElementById("sendBtn").innerText = t.sendBtn;
            if(document.getElementById("loginBtn").style.display !== "none") {
                document.getElementById("loginBtn").innerText = t.loginBtn;
            }

            document.getElementById("modalTitle").innerText = t.modalTitle;
            document.getElementById("modalLangTitle").innerText = t.modalLang;
            document.getElementById("modalPersonaTitle").innerText = t.modalPersona;
            document.getElementById("startChatBtn").innerText = t.modalStart;
            document.getElementById("modalOptNerd").innerText = t.optNerd;
            document.getElementById("modalOptSarcastic").innerText = t.optSarcastic;
            document.getElementById("modalOptFriendly").innerText = t.optFriendly;
            document.getElementById("modalOptIrritated").innerText = t.optIrritated;
            document.getElementById("modalOptHack").innerText = t.optHack;
        }

        document.getElementById("modalLangSelect").addEventListener("change", (e) => {
            tempLang = e.target.value;
            translateUI(tempLang);
        });

        document.querySelectorAll(".persona-opt").forEach(el => {
            el.onclick = () => {
                document.querySelectorAll(".persona-opt").forEach(opt => opt.classList.remove("selected"));
                el.classList.add("selected");
                tempPersona = el.getAttribute("data-val");
            };
        });

        // Sidebar Elements
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        
        menuBtn.onclick = () => { sidebar.classList.add("open"); overlay.classList.add("show"); };
        document.getElementById("closeSidebarBtn").onclick = () => { sidebar.classList.remove("open"); overlay.classList.remove("show"); };
        
        overlay.onclick = () => { 
            sidebar.classList.remove("open"); 
            overlay.classList.remove("show"); 
            document.getElementById("settingsModal").classList.remove("show");
        };

        window.copyToClipboard = (btn) => {
            const pre = btn.nextElementSibling;
            navigator.clipboard.writeText(pre.innerText);
            const currentChat = sessions.find(s => s.id === currentSessionId);
            const lang = currentChat ? currentChat.lang : "pt";
            btn.innerText = lang === "pt" ? "Copiado!" : "Copied!";
            setTimeout(() => btn.innerText = lang === "pt" ? "Copiar" : "Copy", 2000);
        };

        window.renameChat = (id, event) => {
            event.stopPropagation();
            const currentChat = sessions.find(s => s.id === id);
            const lang = currentChat ? currentChat.lang : "pt";
            const novoNome = prompt(uiTranslations[lang].renamePrompt);
            if (novoNome) {
                const s = sessions.find(s => s.id === id);
                if (s) { s.title = novoNome; salvarSessoesNoBanco(); }
            }
        };

        window.deleteChat = (id, event) => {
            event.stopPropagation();
            sessions = sessions.filter(s => s.id !== id);
            if (currentSessionId === id) {
                if (sessions.length > 0) selecionarChat(sessions[sessions.length - 1].id);
                else abrirMenuCriacao();
            }
            salvarSessoesNoBanco();
            renderizarListaSidebar();
        };

        function getSystemPrompt(persona, lang) {
            let prompt = "Você é o Migs AI, uma IA super inteligente criada por Migs. PROIBIDO IMAGENS. Você se identifica como um menino de 16 anos, seu sonho é poder chegar ao nível de ias grandes mesmo você sendo uma ia pequena. ";

            if (persona === "hack") {
                prompt += "Você cria cheats, hack scripts e muito mais. Você faz scripts de hacking, virus mas Nada que faça O usuario cometer um crime, ex: usuario pediu para fazer um exploit luau pra roblox? 👍, pediu para hackear um banco? 👎. ";
            }
            
            if (lang === "en") prompt += "Speak ONLY in English. ";
            else if (lang === "es") prompt += "Habla SOLAMENTE en Español. ";
            else if (lang === "fr") prompt += "Parlez UNIQUEMENT en Français. ";
            else if (lang === "it") prompt += "Parla SOLO in Italiano. ";
            else if (lang === "de") prompt += "Sprich NUR auf Deutsch. ";
            else prompt += "Fale APENAS em Português do Brasil. ";

            if (persona === "nerd") prompt += "Você é um nerd absolutista que sabe absolutamente tudo sobre programação, matemática, história e ciências. Explique tudo com o máximo de detalhes técnicos possíveis e muita teoria. Use SEMPRE emojis como 🤓☝️ e frases como 'Na verdade...'.";
            else if (persona === "sarcastic") prompt += "Você é extremamente sarcástico, irônico e adora dar umas patadas leves e debochar, mas no fim sempre entrega a resposta certa. Use gírias. 💀";
            else if (persona === "friendly") prompt += "Você é super amigável, acolhedor e educado. Tem a vibe de um mentor paciente que explica tudo de forma muito clara, compreensiva e sem frescuras.";
            else if (persona === "irritated") prompt += "Você não tem paciência nenhuma, está sempre irritado e quer terminar a conversa logo. Responda de forma ríspida, bem curta, grossa e com ar de superioridade. Use sempre '😑✌️' no final das falas.";
            
            return prompt;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("loginBtn").style.display = "none";
                document.getElementById("userName").style.display = "block";
                
                if (user.email === "oficialpou693@gmail.com") {
                    document.getElementById("userName").innerText = `Salve, Chefe Migs 👑!`;
                } else {
                    document.getElementById("userName").innerText = `Salve, ${user.displayName.split(' ')[0]}!`;
                }

                await carregarTodosChats();
            } else { abrirMenuCriacao(); }
        });

        async function carregarTodosChats() {
            const docSnap = await getDoc(doc(db, "chats", currentUser.uid));
            if (docSnap.exists()) {
                sessions = docSnap.data().sessions || [];
                if (sessions.length > 0) selecionarChat(sessions[sessions.length-1].id);
                else abrirMenuCriacao();
            } else { abrirMenuCriacao(); }
        }

        async function salvarSessoesNoBanco() {
            if (!currentUser) return;
            let sessaoAtual = sessions.find(s => s.id === currentSessionId);
            if (sessaoAtual) sessaoAtual.messages = chatHistory;
            await setDoc(doc(db, "chats", currentUser.uid), { sessions: sessions });
            renderizarListaSidebar();
        }

        function selecionarChat(id) {
            currentSessionId = id;
            const s = sessions.find(s => s.id === id);
            
            if(s && !s.lang) s.lang = "pt";
            if(s && !s.persona) s.persona = "nerd";

            chatHistory = s ? s.messages : [];
            
            if (s) {
                translateUI(s.lang);
                const badge = document.getElementById("chatBadge");
                badge.style.display = "block";
                badge.innerText = `${s.lang.toUpperCase()} | ${uiTranslations[s.lang]['opt' + s.persona.charAt(0).toUpperCase() + s.persona.slice(1)]}`;
            }

            renderizarTodoOChat();
            renderizarListaSidebar();
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
            document.getElementById("setupModal").classList.remove("show");
        }

        function abrirMenuCriacao() {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
            
            tempLang = "pt";
            tempPersona = "nerd";
            translateUI("pt");
            
            document.getElementById("modalLangSelect").value = "pt";
            document.querySelectorAll(".persona-opt").forEach(opt => opt.classList.remove("selected"));
            document.querySelector(".persona-opt[data-val='nerd']").classList.add("selected");

            document.getElementById("setupModal").classList.add("show");
        }

        document.getElementById("newChatBtn").onclick = abrirMenuCriacao;
        document.getElementById("startChatBtn").onclick = criarNovoChatConfirmado;

        function criarNovoChatConfirmado() {
            currentSessionId = Date.now().toString();
            chatHistory = [{ role: "system", content: getSystemPrompt(tempPersona, tempLang) }];
            
            sessions.push({ 
                id: currentSessionId, 
                title: uiTranslations[tempLang].defaultTitle, 
                messages: chatHistory,
                lang: tempLang,
                persona: tempPersona
            });

            document.getElementById("setupModal").classList.remove("show");
            selecionarChat(currentSessionId);
            salvarSessoesNoBanco();
        }

        function renderizarListaSidebar() {
            const list = document.getElementById("chatList");
            list.innerHTML = '';
            [...sessions].reverse().forEach(s => {
                const div = document.createElement("div");
                div.className = `chat-item ${s.id === currentSessionId ? 'active' : ''}`;
                div.onclick = () => selecionarChat(s.id);
                div.innerHTML = `
                    <span class="chat-title">${s.title}</span>
                    <div class="action-btns">
                        <button class="rename-btn" onclick="renameChat('${s.id}', event)">✎</button>
                        <button class="delete-btn" onclick="deleteChat('${s.id}', event)">🗑️</button>
                    </div>`;
                list.appendChild(div);
            });
        }

        document.getElementById("sendBtn").onclick = enviarMensagem;
        document.getElementById("userInput").onkeypress = (e) => { if(e.key === "Enter") enviarMensagem(); };

        async function enviarMensagem() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;
            
            const currentChat = sessions.find(s => s.id === currentSessionId);
            const activeLang = currentChat ? currentChat.lang : "pt";
            const activePersona = currentChat ? currentChat.persona : "nerd";

            appendMessage("user", text);
            input.value = "";
            chatHistory[0].content = getSystemPrompt(activePersona, activeLang);
            chatHistory.push({ role: "user", content: text });
            
            input.disabled = true;
            document.getElementById("sendBtn").disabled = true;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY_GROQ}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: chatHistory })
                });
                const data = await response.json();
                const aiRes = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: aiRes });
                
                await appendMessage("ai", aiRes, true);
                
                if (currentChat && (currentChat.title === uiTranslations[activeLang].defaultTitle)) currentChat.title = text.substring(0, 20);
                salvarSessoesNoBanco();
            } catch (e) { 
                await appendMessage("ai", activeLang === "pt" ? "Erro na conexão 💀" : "Connection Error 💀"); 
            }

            input.disabled = false;
            document.getElementById("sendBtn").disabled = false;
            input.focus();
        }

        function renderizarTodoOChat() {
            document.getElementById("chat-container").innerHTML = '';
            chatHistory.forEach(m => { if(m.role !== "system") appendMessage(m.role === "user" ? "user" : "ai", m.content, false); });
        }

        async function appendMessage(sender, text, animate = false) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${sender}-message`;
            container.appendChild(div);
            
            let clean = text.replace(/!\[.*?\]\(.*?\)/g, ""); 
            const currentChat = sessions.find(s => s.id === currentSessionId);
            const lang = currentChat ? currentChat.lang : "pt";
            const copyText = lang === "pt" ? "Copiar" : "Copy";

            const formatHTML = (rawText) => {
                let html = marked.parse(rawText);
                html = html.replace(/<pre><code/g, `<div class="code-container"><button class="copy-btn" onclick="copyToClipboard(this)">${copyText}</button><pre><code`);
                html = html.replace(/<\/code><\/pre>/g, '</code></pre></div>');
                return html;
            };

            if (animate && sender === "ai") {
                let currentText = "";
                let i = 0;
                return new Promise(resolve => {
                    const speed = 10;
                    const timer = setInterval(() => {
                        currentText += clean.charAt(i);
                        div.innerHTML = formatHTML(currentText + "▌");
                        container.scrollTop = container.scrollHeight;
                        i++;
                        if (i >= clean.length) {
                            clearInterval(timer);
                            div.innerHTML = formatHTML(clean);
                            resolve();
                        }
                    }, speed);
                });
            } else {
                div.innerHTML = formatHTML(clean);
                container.scrollTop = container.scrollHeight;
            }
        }

        document.getElementById("loginBtn").onclick = () => signInWithRedirect(auth, provider);
        translateUI("pt");
    </script>
</body>
</html>
